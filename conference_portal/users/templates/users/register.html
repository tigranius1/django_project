{% extends 'base.html' %}

{% block title %}Регистрация - Конференции.РФ{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-person-plus"></i> Регистрация</h4>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label"><i class="bi bi-person"></i> Логин</label>
                        <input type="text" name="username" id="id_username" class="form-control"
                               placeholder="Только латиница и цифры"
                               minlength="6" pattern="[A-Za-z0-9]+" required>
                        <div class="form-text">Только латиница и цифры, не менее 6 символов</div>
                    </div>
                    <div class="mb-3">
                        <label for="id_password1" class="form-label"><i class="bi bi-lock"></i> Пароль</label>
                        <input type="password" name="password1" id="id_password1" class="form-control"
                               placeholder="Не менее 8 символов" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password2" class="form-label"><i class="bi bi-lock-fill"></i> Подтверждение</label>
                        <input type="password" name="password2" id="id_password2" class="form-control"
                               minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_full_name" class="form-label"><i class="bi bi-person-vcard"></i> ФИО</label>
                        <input type="text" name="full_name" id="id_full_name" class="form-control"
                               placeholder="Иванов Иван Иванович">
                        <div class="form-text">Только кириллица и пробелы</div>
                    </div>
                    <div class="mb-3">
                        <label for="id_phone" class="form-label"><i class="bi bi-telephone"></i> Телефон</label>
                        <input type="tel" name="phone" id="id_phone" class="form-control"
                               placeholder="8(XXX)XXX-XX-XX">
                        <div class="form-text">Формат: 8(XXX)XXX-XX-XX</div>
                    </div>
                    <div class="mb-3">
                        <label for="id_email" class="form-label"><i class="bi bi-envelope"></i> Электронная почта</label>
                        <input type="email" name="email" id="id_email" class="form-control"
                               placeholder="example@domain.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle"></i> Создать пользователя
                    </button>
                </form>
                <div class="mt-3 text-center">
                    <p class="small mb-0">Уже зарегистрированы? <a href="{% url 'users:login' %}">Войти</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const phone = document.getElementById('id_phone');
        phone.addEventListener('input', function () {
            const pattern = /^8\(\d{3}\)\d{3}-\d{2}-\d{2}$/;
            if (phone.value && !pattern.test(phone.value)) {
                phone.setCustomValidity('Формат: 8(XXX)XXX-XX-XX');
            } else {
                phone.setCustomValidity('');
            }
        });
    });
</script>
{% endblock %}

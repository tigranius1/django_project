{% extends 'base.html' %}
{% block title %}Удаление заявки{% endblock %}
{% block content %}
<div class="alert alert-danger">
    <h4><i class="bi bi-exclamation-triangle"></i> Удалить заявку "{{ object.room_name }}"?</h4>
    <form method="post" class="d-flex gap-2 flex-wrap">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash"></i> Да, удалить
        </button>
        <a href="{% url 'bookings:booking_list' %}" class="btn btn-secondary">
            <i class="bi bi-x-circle"></i> Отмена
        </a>
    </form>
</div>
{% endblock %}
